<canvas id="c"></canvas><div id="ov"></div><button id="cartBtn" onclick="toggleCart()" style="position:fixed;right:18px;bottom:18px;display:none;z-index:5;font-size:28px;min-width:64px;min-height:64px;border-radius:50%">🛒</button>
<script>
const SHOP=[
{id:'gloves',n:'🧤 Better Gloves',d:l=>'+'+l+' hand carry (max 4 without cart)',max:1,c:40,g:1.6},
{id:'shoes',n:'👟 Better Shoes',d:l=>'+'+(l*6)+'% move speed',max:5,c:40,g:1.6},
{id:'mop',n:'🧽 Better Mop',d:l=>'+'+(l*20)+'% mop speed',max:5,c:35,g:1.6},
{id:'squeegee',n:'🧹 Squeegee / Wet Vac',d:l=>'+'+(l*8)+' mop reach',max:3,c:80,g:1.8},
{id:'kneepads',n:'🦵 Kneepads',d:l=>'+'+(l*25)+'% motor decon speed',max:4,c:50,g:1.6},
{id:'bigbags',n:'🛍️ Bigger Bags',d:l=>'+'+(l*15)+'% XP per DAW drop',max:4,c:60,g:1.7},
{id:'seniority',n:'📜 Seniority',d:l=>'+'+(l*8)+'% all XP',max:5,c:70,g:1.7},
{id:'coffee',n:'☕ Coffee',d:l=>'+'+(l*12)+'% speed for first 60s',max:3,c:30,g:1.8},
{id:'tyvek',n:'🥼 Better Tyvek',d:l=>'-'+(l*12)+'% dose taken',max:4,c:60,g:1.7},
{id:'training',n:'🎓 Dosimetry Training',d:l=>'ED set points '+(10+l*5)+' mR / '+(100+l*50)+' mR/hr',max:3,c:120,g:1.8},
{id:'rpbuddy',n:'🧑‍🔬 RP Buddy',d:l=>'-'+(l*25)+'% XP lost on ED reset',max:3,c:50,g:1.7},
{id:'cart',n:'🛒 Laundry Cart',d:l=>l?'Owned: press C / tap 🛒 to grab or park':'Start every shift with a cart (8+ bags)',max:1,c:750,g:1}];
let META;try{META=JSON.parse(localStorage.getItem('deconMeta'))}catch(e){}META=META||{pay:0,lv:{},shifts:0};
const saveMeta=()=>{try{localStorage.setItem('deconMeta',JSON.stringify(META))}catch(e){}};
const ML=id=>META.lv[id]||0,cost=it=>Math.round(it.c*Math.pow(it.g,ML(it.id)));
function applyMeta(){const u=S.up;u.cap=Math.min(4,u.cap+ML('gloves'));u.spd*=1+.06*ML('shoes');u.mop*=1+.2*ML('mop');u.decon*=1+.25*ML('kneepads');
S.reach=4+8*ML('squeegee');S.doseMul=1-.12*ML('tyvek');S.sp1=10+5*ML('training');S.sp2=100+50*ML('training');S.xpMul=1+.08*ML('seniority');S.bagMul=1+.15*ML('bigbags');S.coffee=.12*ML('coffee');S.rpMul=1-.25*ML('rpbuddy');S.hasCart=ML('cart')>0}
function toggleCart(){if(!S.hasCart||S.paused)return;const u=S.up;if(u.cart&&S.p.carry.length>u.cap){float(S.p.x,S.p.y-30,'Unload first!','#f88');return}u.cart=!u.cart;float(S.p.x,S.p.y-30,u.cart?'🛒 Cart!':'Cart parked',u.cart?'#fc0':'#ccc')}
const capOf=()=>S.up.cart?S.up.cartCap:S.up.cap;
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='c')toggleCart()});
function shop(from){S.paused=true;const it=SHOP.map(i=>{const l=ML(i.id),mx=l>=i.max,c=cost(i),ok=!mx&&META.pay>=c;
return`<div class="card shop"><h3>${i.n}</h3><div>Lv ${l}/${i.max}</div><p>${i.d(Math.max(l,mx?l:l+1))}${mx?'':l?' (next)':''}</p><button ${ok?'':'disabled'} onclick="buy('${i.id}','${from}')">${mx?'MAXED':'💵 '+c}</button></div>`}).join('');
OV.innerHTML=`<div class="box wide"><h1>🏪 Outage Shop</h1><h2>💵 Outage Pay: ${META.pay}</h2><div>${it}</div><button style="font-size:20px" onclick="${from==='end'?'start()':'title()'}">${from==='end'?'▶ Next Shift':'◀ Back'}</button>
<details style="margin-top:14px;opacity:.6"><summary>Settings</summary><button style="background:#a33;color:#fff" onclick="if(confirm('Reset ALL progress?')){META={pay:0,lv:{},shifts:0};saveMeta();shop('${from}')}">Reset progress</button></details></div>`;OV.style.display='flex'}
function buy(id,from){const i=SHOP.find(s=>s.id===id),c=cost(i);if(META.pay<c||ML(id)>=i.max)return;META.pay-=c;META.lv[id]=ML(id)+1;saveMeta();shop(from)}
const C=document.getElementById('c');let X=C.getContext('2d');const OV=document.getElementById('ov');
const W=1100,H=700,SHIFT=300;
const walls=[[0,0,W,12],[0,H-12,W,12],[0,0,12,H],[W-12,0,12,H],
[360,12,16,250],[360,330,16,200],[360,600,16,88],[740,12,16,150],[740,230,16,300],[740,600,16,88],[12,350,160,16],[240,350,120,16],[756,380,120,16],[950,380,138,16]];
const DAW={x:20,y:20,w:150,h:110},RP={x:W-160,y:H-120,w:140,h:100};
const hot=[{x:560,y:110,r:80,rate:300},{x:220,y:540,r:70,rate:150},{x:950,y:200,r:65,rate:500},{x:560,y:520,r:50,rate:120}];
let S,keys={},joy=null;
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
function tp(t){return{x:t.clientX,y:t.clientY}}
C.addEventListener('touchstart',e=>{e.preventDefault();if(joy)return;const t=e.changedTouches[0],q=tp(t);joy={id:t.identifier,ox:q.x,oy:q.y,x:q.x,y:q.y}},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(joy&&t.identifier===joy.id){const q=tp(t);joy.x=q.x;joy.y=q.y}},{passive:false});
const jend=e=>{for(const t of e.changedTouches)if(joy&&t.identifier===joy.id)joy=null};C.addEventListener('touchend',jend);C.addEventListener('touchcancel',jend);
document.addEventListener('touchmove',e=>{if(!e.target.closest||!e.target.closest('.box'))e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()};onkeyup=e=>keys[e.key.toLowerCase()]=0;
function reset(){S={t:0,p:{x:900,y:600,r:13,carry:[]},xp:0,lvl:1,next:5,items:[],spills:[],motor:null,workers:[],
dose:0,rate:0,alarm:false,stats:{bags:0,spills:0,motors:0,alarms:0},cleans:0,cleanCD:0,banner:0,
up:{spd:1,cap:3,cartCap:8,carrySpd:0.7,mop:1,decon:1,push:0,cart:false},
spawnT:0,spillT:3,motorT:40,paused:true,floats:[],over:false};
for(let i=0;i<5;i++)S.workers.push({x:400+Math.random()*300,y:300+Math.random()*200,vx:0,vy:0,t:0});
for(let i=0;i<4;i++)spawnItem();applyMeta()}
function solid(x,y,r){if(x<r||y<r||x>W-r||y>H-r)return true;for(const w of walls)if(x+r>w[0]&&x-r<w[0]+w[2]&&y+r>w[1]&&y-r<w[1]+w[3])return true;return false}
const CANS=[{x:250,y:210,n:'Aux Bldg'},{x:95,y:440,n:'Pipe Chase'},{x:650,y:320,n:'Containment'},{x:830,y:90,n:'Turbine'},{x:810,y:470,n:'RCA Hall'}],CAN_CAP=8;
function nearCan(x,y,d=55){return CANS.some(c=>Math.hypot(c.x-x,c.y-y)<d)}
function freeSpot(r=14){let x,y;do{x=30+Math.random()*(W-60);y=30+Math.random()*(H-60)}while(solid(x,y,r)||inR({x,y},DAW,30)||inR({x,y},RP,30)||nearCan(x,y));return{x,y}}
function inR(p,a,m=0){return p.x>a.x-m&&p.x<a.x+a.w+m&&p.y>a.y-m&&p.y<a.y+a.h+m}
function spawnItem(){const open=CANS.filter(c=>S.items.filter(i=>i.can===c).length<CAN_CAP);if(!open.length)return;const c=open[Math.random()*open.length|0];
const used=new Set(S.items.filter(i=>i.can===c).map(i=>i.slot));let k=0;while(used.has(k))k++;const a=(k%6)/6*6.283+.4,r=k<6?26:21,j=()=>(Math.random()-.5)*4;
S.nSp=(S.nSp||0)+1;S.dirty=true;S.items.push({x:c.x+Math.cos(a)*r+j(),y:c.y+Math.sin(a)*r+j(),z:k<6?0:13,can:c,slot:k,type:Math.random()<.55?'trash':'laundry'})}
function spawnSpill(){S.dirty=true;S.nSl=(S.nSl||0)+1;const s=freeSpot();S.spills.push({...s,r:16+Math.random()*10,prog:0,age:0})}
function float(x,y,txt,col='#fc0'){S.floats.push({x,y,txt,col,t:1.2})}
function gainXP(n,x,y){n=Math.round(n*(S.xpMul||1));S.xp+=n;float(x,y,'+'+n+' XP');while(S.xp>=S.next){S.xp-=S.next;S.lvl++;S.next=Math.round(S.next*1.35+3);levelUp()}}
const UPS=[
{id:'spd',n:'👟 Fast Feet',d:'+15% move speed',ok:()=>1,f:()=>S.up.spd*=1.15},
{id:'cap',n:'🎒 Bigger Arms',d:'+1 bag carry capacity',ok:()=>S.up.cap<4,f:()=>S.up.cap++},
{id:'cs',n:'💪 Strong Back',d:'Less slowdown while carrying',ok:()=>S.up.carrySpd<.98,f:()=>S.up.carrySpd=Math.min(1,S.up.carrySpd+.1)},
{id:'mop',n:'🧽 Pro Mop',d:'+40% mop speed',ok:()=>1,f:()=>S.up.mop*=1.4},
{id:'dec',n:'🧴 Decon Wizard',d:'+50% decon speed on motors',ok:()=>1,f:()=>S.up.decon*=1.5},
{id:'push',n:'🫸 "Coming Through!"',d:'Shove workers out of your way (stacks)',ok:()=>S.up.push<3,f:()=>S.up.push++},
{id:'cart',n:'🛒 Laundry Cart',d:'Carry 8 bags! But you turn slow & workers block more',ok:()=>!S.hasCart&&S.lvl>=3,f:()=>{S.hasCart=true;S.up.cart=true}},
{id:'cartp',n:'🛒 Cart Wheels',d:'+3 cart capacity',ok:()=>S.hasCart,f:()=>S.up.cartCap+=3},
{id:'harness',n:'🎽 Backpack Harness',d:'Mop & decon with bags on your back',ok:()=>!S.harness,f:()=>S.harness=true},
{id:'alara',n:'🧱 Lead Blanket',d:'Shrink a random hot zone by 40%',ok:()=>1,f:()=>{const h=hot[Math.random()*hot.length|0];h.r*=.6;h.rate*=.6}}];
function levelUp(){S.paused=true;const pool=UPS.filter(u=>u.ok()).sort(()=>Math.random()-.5).slice(0,3);
OV.innerHTML=`<div class="box"><h2>⬆ LEVEL ${S.lvl}!</h2><p>Pick an upgrade:</p>${pool.map((u,i)=>`<div class="card" id="u${i}"><h3>${u.n}</h3><p>${u.d}</p></div>`).join('')}</div>`;OV.style.display='flex';
pool.forEach((u,i)=>document.getElementById('u'+i).onclick=()=>{u.f();OV.style.display='none';S.paused=false;last=performance.now()})}
function update(dt){const p=S.p,u=S.up;S.t+=dt;if(S.t>=SHIFT)return endShift();
const ramp=1+S.t/200;if(S.cleanCD>0)S.cleanCD-=dt;const hold=S.cleanCD>0;
if(!hold){S.spawnT-=dt;if(S.spawnT<=0){S.spawnT=Math.max(4.5,9/ramp);spawnItem()}
S.spillT-=dt;if(S.spillT<=0){S.spillT=Math.max(11,20/ramp);if(S.spills.length<12)spawnSpill()}
S.motorT-=dt;if(S.motorT<=0&&!S.motor){const s=freeSpot(24);S.motor={...s,prog:0,need:8};S.motorT=60}}
if(!hold&&S.dirty&&!S.items.length&&!S.spills.length&&!S.motor){S.cleans++;S.cleanCD=8;S.dirty=false;S.spawnT=0;S.banner=3;gainXP(15+S.cleans*5,S.p.x,S.p.y-40);spark(S.p.x,S.p.y,'#7f7',30);spark(S.p.x,S.p.y,'#ffd400',30)}if(S.banner>0)S.banner-=dt;
// movement
let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
if(joy){const jx=joy.x-joy.ox,jy=joy.y-joy.oy,jl=Math.hypot(jx,jy);if(jl>8){const m=Math.min(1,jl/60);dx=jx/jl*m;dy=jy/jl*m}}
{const m=Math.min(1,Math.hypot(dx,dy));const r=screenToWorld(dx,dy);dx=r[0]*m;dy=r[1]*m}
let sp=170*u.spd*(S.t<60?1+S.coffee:1)*(p.carry.length?u.carrySpd:1)*(u.cart?0.85:1);
p.vx=p.vx||0;p.vy=p.vy||0;const acc=u.cart?3:14;p.vx+=(dx*sp-p.vx)*Math.min(1,acc*dt);p.vy+=(dy*sp-p.vy)*Math.min(1,acc*dt);
const pr=u.cart?18:p.r;
if(!solid(p.x+p.vx*dt,p.y,pr))p.x+=p.vx*dt;if(!solid(p.x,p.y+p.vy*dt,pr))p.y+=p.vy*dt;
// workers
for(const w of S.workers){w.t-=dt;if(w.t<=0){const a=Math.random()*6.28;w.vx=Math.cos(a)*60;w.vy=Math.sin(a)*60;w.t=1+Math.random()*3}
if(!solid(w.x+w.vx*dt,w.y,12))w.x+=w.vx*dt;else w.vx*=-1;if(!solid(w.x,w.y+w.vy*dt,12))w.y+=w.vy*dt;else w.vy*=-1;
const ddx=p.x-w.x,ddy=p.y-w.y,d=Math.hypot(ddx,ddy),md=pr+12;
if(d<md&&d>0){const nx=ddx/d,ny=ddy/d,o=md-d;
if(u.push){const k=u.push*.35;const wx=w.x-nx*o*(1+k),wy=w.y-ny*o*(1+k);if(!solid(wx,wy,12)){w.x=wx;w.y=wy;if(Math.random()<.02)float(w.x,w.y-20,'Hey!','#aaf')}else{p.x+=nx*o;p.y+=ny*o}}
else{p.x+=nx*o;p.y+=ny*o;p.vx*=u.cart?.2:.5;p.vy*=u.cart?.2:.5}}}
if(S.workers.length<5+S.t/50)S.workers.push({...freeSpot(),vx:0,vy:0,t:0});
// pickup
for(let i=S.items.length-1;i>=0;i--){const it=S.items[i];if(Math.hypot(it.x-p.x,it.y-p.y)<pr+12&&p.carry.length<capOf()){p.carry.push(it.type);S.items.splice(i,1)}}
if(inR(p,DAW)&&p.carry.length){const n=p.carry.length;const xp=p.carry.reduce((a,t)=>a+(t==='laundry'?2:1),0)+(n>=4?Math.floor(n/2):0);const xp2=Math.round(xp*S.bagMul);S.stats.bags+=n;p.carry=[];gainXP(xp2,p.x,p.y-20);spark(p.x,p.y,'#ffd400',14)}
// spills: mop
for(let i=S.spills.length-1;i>=0;i--){const s=S.spills[i];s.age+=dt;if(s.age>60&&s.r<36){s.r+=dt*0.3}
if(Math.hypot(s.x-p.x,s.y-p.y)<s.r+S.reach&&!u.cart&&(S.harness||!p.carry.length)){if(Math.random()<dt*12)spark(s.x,s.y,'#bfe8ff',3);s.prog+=dt*u.mop*(30/s.r)*0.8;if(s.prog>=1){S.spills.splice(i,1);S.stats.spills++;gainXP(3,s.x,s.y)}}}
if(S.motor){const m=S.motor;if(Math.hypot(m.x-p.x,m.y-p.y)<pr+28&&(S.harness||!p.carry.length)){m.prog+=dt*u.decon;if(m.prog>=m.need){S.motor=null;S.stats.motors++;gainXP(15,m.x,m.y);spark(m.x,m.y,'#f80',20)}}}
// dose
let rate=0.5;for(const h of hot){const d=Math.hypot(h.x-p.x,h.y-p.y);if(d<h.r)rate+=h.rate*(1-d/h.r*.6);else if(d<h.r*1.6)rate+=h.rate*.08}
S.rate=rate;S.dose+=rate*S.doseMul*dt/3600*12; // 12x time compression
if(!S.alarm&&(S.dose-(S.doseBase||0)>=S.sp1||rate>=S.sp2)){S.alarm=true;S.stats.alarms++;float(p.x,p.y-30,'ED ALARM! 🚨 Go see RP','#f44');S.alarmDoseBase=S.dose}
if(S.alarm&&inR(p,RP)){S.alarm=false;if(S.dose-(S.doseBase||0)>=S.sp1)S.doseBase=S.dose;const lost=Math.min(S.xp,Math.ceil(S.next*.4*S.rpMul));S.xp-=lost;float(p.x,p.y-30,'ED reset. -'+lost+' XP. Stay ALARA!','#f88');if(S.dose>=S.sp1)S.dose10=(S.dose10||0)+1}
for(const f of S.floats){f.t-=dt;f.y-=30*dt}S.floats=S.floats.filter(f=>f.t>0)}
function endShift(){S.paused=true;S.over=true;const dose=S.dose,alara=dose<3?500:dose<6?250:dose<10?100:0;
const pay=Math.round(S.cleans*40+S.stats.bags*2+S.stats.spills*4+S.stats.motors*15+alara/25+S.lvl*2);META.pay+=pay;META.shifts++;saveMeta();
const score=S.stats.bags*10+S.stats.spills*25+S.stats.motors*100+S.lvl*50+alara-S.stats.alarms*100;
OV.innerHTML=`<div class="box"><h1>🔔 END OF SHIFT</h1><table style="margin:auto;font-size:18px;text-align:left">
<tr><td>🗑️ Bags hauled to DAW</td><td>${S.stats.bags}</td></tr><tr><td>🧽 Spills mopped</td><td>${S.stats.spills}</td></tr>
<tr><td>⚙️ Motors decon'd</td><td>${S.stats.motors}</td></tr><tr><td>⭐ Level reached</td><td>${S.lvl}</td></tr>
<tr><td>☢️ Total dose</td><td>${dose.toFixed(2)} mR</td></tr><tr><td>🚨 ED alarms</td><td>${S.stats.alarms}</td></tr><tr><td>✨ Plant cleared</td><td>${S.cleans}× (+${S.cleans*40} 💵)</td></tr>
<tr><td>🏅 ALARA bonus</td><td>${alara}</td></tr><tr><td><b>SCORE</b></td><td><b>${score}</b></td></tr></table>
<p>${alara>=500?'RP is proud of you. Textbook ALARA.':alara?'Decent dose management.':'RP wants a word with you...'}</p><h2>💵 Outage Pay earned: +${pay} (bank: ${META.pay})</h2><button onclick="shop('end')" style="font-size:20px">🏪 Shop</button><button onclick="start()">Work another shift</button></div>`;OV.style.display='flex'}
const IX=0.72,IY=0.36,WH=30;let DPR=1,VW=0,VH=0,ZM=1,camX=0,camY=0,floorC=null;
function iso(x,y,z=0){return[(x-y)*IX,(x+y)*IY-z]}
function poly(pts,fill,stroke){X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)X.lineTo(pts[i][0],pts[i][1]);X.closePath();X.fillStyle=fill;X.fill();if(stroke){X.strokeStyle=stroke;X.stroke()}}
function quad(x,y,w,h,z,fill,stroke){poly([iso(x,y,z),iso(x+w,y,z),iso(x+w,y+h,z),iso(x,y+h,z)],fill,stroke)}
