<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Decon Tech: Outage Shift</title>
<style>body{margin:0;background:#111;color:#eee;font-family:sans-serif;overflow:hidden;position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}canvas{position:absolute;touch-action:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75)}
.box{background:#1d2630;border:3px solid #fc0;padding:24px;border-radius:10px;max-width:640px;max-height:92vh;overflow:auto;text-align:center;box-sizing:border-box;margin:8px}
button{min-height:48px;min-width:140px;background:#fc0;border:0;padding:10px 18px;font-size:16px;border-radius:6px;cursor:pointer;margin:6px;font-weight:bold}
.card{display:inline-block;width:170px;min-height:90px;font-size:16px;vertical-align:top;background:#2b3846;border:2px solid #fc0;border-radius:8px;padding:10px;margin:6px;cursor:pointer}
.card.shop{width:200px;max-width:calc(50% - 14px);box-sizing:border-box;padding:8px;margin:4px}.card button{width:100%;min-width:0;margin:6px 0 0}.box.wide{max-width:960px;width:94vw;padding:12px}button:disabled{background:#666;color:#aaa}.card:hover{background:#3d5166}ul{text-align:left}</style></head><body>
<canvas id="c"></canvas><div id="ov"></div><button id="cartBtn" onclick="toggleCart()" style="position:fixed;right:18px;bottom:18px;display:none;z-index:5;font-size:28px;min-width:64px;min-height:64px;border-radius:50%">🛒</button>
<script>
const SHOP=[
{id:'gloves',n:'🧤 Better Gloves',d:l=>'+'+l+' hand carry (hard max 4 without cart)',max:1,c:40,g:1.6},
{id:'shoes',n:'👟 Better Shoes',d:l=>'+'+(l*6)+'% move speed',max:5,c:40,g:1.6},
{id:'mop',n:'🧽 Better Mop',d:l=>'+'+(l*20)+'% mop speed',max:5,c:35,g:1.6},
{id:'squeegee',n:'🧹 Squeegee / Wet Vac',d:l=>'+'+(l*8)+' mop reach',max:3,c:80,g:1.8},
{id:'kneepads',n:'🦵 Kneepads',d:l=>'+'+(l*25)+'% motor decon speed',max:4,c:50,g:1.6},
{id:'bigbags',n:'🛍️ Bigger Bags',d:l=>'+'+(l*15)+'% XP per DAW drop',max:4,c:60,g:1.7},
{id:'seniority',n:'📜 Seniority',d:l=>'+'+(l*8)+'% all XP',max:5,c:70,g:1.7},
{id:'coffee',n:'☕ Coffee',d:l=>'+'+(l*12)+'% speed for first 60s',max:3,c:30,g:1.8},
{id:'tyvek',n:'🥼 Better Tyvek',d:l=>'-'+(l*12)+'% dose taken',max:4,c:60,g:1.7},
{id:'training',n:'🎓 Dosimetry Training',d:l=>'ED set points '+(10+l*5)+' mR / '+(100+l*50)+' mR/hr',max:3,c:120,g:1.8},
{id:'rpbuddy',n:'🧑‍🔬 RP Buddy',d:l=>'-'+(l*25)+'% XP lost on ED reset',max:3,c:50,g:1.7},
{id:'magnet',n:'🧲 XP Magnet',d:l=>'+'+(l*12)+' bubble pickup radius',max:4,c:45,g:1.6},
{id:'buddy',n:'🧑‍🔧 Apprentice Buddy',d:l=>l>=2?'Collects bubbles AND hauls bags to DAW':'Follows you and collects XP bubbles'+(l?' (next: hauls bags)':''),max:2,c:300,g:2},
{id:'cart',n:'🛒 Laundry Cart',d:l=>l?'Owned: press C / tap 🛒 to grab or park':'Start every shift with a cart (8+ bags)',max:1,c:750,g:1}];
let META;try{META=JSON.parse(localStorage.getItem('deconMeta'))}catch(e){}META=META||{pay:0,lv:{},shifts:0};
const saveMeta=()=>{try{localStorage.setItem('deconMeta',JSON.stringify(META))}catch(e){}};
const ML=id=>META.lv[id]||0,cost=it=>Math.round(it.c*Math.pow(it.g,ML(it.id)));
function applyMeta(){const u=S.up;u.cap=Math.min(4,u.cap+ML('gloves'));u.spd*=1+.06*ML('shoes');u.mop*=1+.2*ML('mop');u.decon*=1+.25*ML('kneepads');
S.reach=4+8*ML('squeegee');S.doseMul=1-.12*ML('tyvek');S.sp1=10+5*ML('training');S.sp2=100+50*ML('training');S.xpMul=1+.08*ML('seniority');S.bagMul=1+.15*ML('bigbags');S.coffee=.12*ML('coffee');S.rpMul=1-.25*ML('rpbuddy');S.hasCart=ML('cart')>0;S.buddy=ML('buddy')?{x:S.p.x-30,y:S.p.y-30,vx:0,vy:0,carry:null}:null;S.buddyCD=0;applyCos();S.magnet+=12*ML('magnet')}
function toggleCart(){if(!S.hasCart||S.paused)return;const u=S.up;if(u.cart&&S.p.carry.length>Math.min(4,u.cap)){float(S.p.x,S.p.y-30,'Unload first!','#f88');return}u.cart=!u.cart;float(S.p.x,S.p.y-30,u.cart?'🛒 Cart!':'Cart parked',u.cart?'#fc0':'#ccc')}
const capOf=()=>S.up.cart?S.up.cartCap:Math.min(4,S.up.cap);
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='c')toggleCart()});
function shop(from,tab){S.paused=true;if(tab==='cos'){OV.innerHTML=`<div class="box wide"><h1>🎨 Cosmetics</h1><h2>💵 Outage Pay: ${META.pay}</h2><button onclick="shop('${from}')">🏪 Gear</button><button disabled>🎨 Cosmetics</button><div>${cosHTML(from)}</div><button style="font-size:20px" onclick="${from==='end'?'shiftSelect()':'title()'}">${from==='end'?'▶ Next Shift':'◀ Back'}</button></div>`;OV.style.display='flex';return}const it=SHOP.map(i=>{const l=ML(i.id),mx=l>=i.max,c=cost(i),ok=!mx&&META.pay>=c;
return`<div class="card shop"><h3>${i.n}</h3><div>Lv ${l}/${i.max}</div><p>${i.d(Math.max(l,mx?l:l+1))}${mx?'':l?' (next)':''}</p><button ${ok?'':'disabled'} onclick="buy('${i.id}','${from}')">${mx?'MAXED':'💵 '+c}</button></div>`}).join('');
OV.innerHTML=`<div class="box wide"><h1>🏪 Outage Shop</h1><h2>💵 Outage Pay: ${META.pay}</h2><button disabled>🏪 Gear</button><button onclick="shop('${from}','cos')">🎨 Cosmetics</button><div>${it}</div><button style="font-size:20px" onclick="${from==='end'?'shiftSelect()':'title()'}">${from==='end'?'▶ Next Shift':'◀ Back'}</button>
<details style="margin-top:14px;opacity:.6"><summary>Settings</summary><button style="background:#a33;color:#fff" onclick="if(confirm('Reset ALL progress?')){META={pay:0,lv:{},shifts:0};saveMeta();shop('${from}')}">Reset progress</button></details></div>`;OV.style.display='flex'}
function buy(id,from){const i=SHOP.find(s=>s.id===id),c=cost(i);if(META.pay<c||ML(id)>=i.max)return;META.pay-=c;META.lv[id]=ML(id)+1;saveMeta();shop(from)}
const C=document.getElementById('c');let X=C.getContext('2d');const OV=document.getElementById('ov');
const W=1100,H=700,SHIFT=300;
const walls=[[0,0,W,12],[0,H-12,W,12],[0,0,12,H],[W-12,0,12,H],
[360,12,16,250],[360,330,16,200],[360,600,16,88],[740,12,16,150],[740,230,16,300],[740,600,16,88],[12,350,160,16],[240,350,120,16],[756,380,120,16],[950,380,138,16]];
const DAW={x:20,y:20,w:150,h:110},RP={x:W-160,y:H-120,w:140,h:100};
const hot=[{x:560,y:110,r:80,rate:300},{x:220,y:540,r:70,rate:150},{x:950,y:200,r:65,rate:500},{x:560,y:520,r:50,rate:120}];
let S,keys={},joy=null;
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
function tp(t){return{x:t.clientX,y:t.clientY}}
C.addEventListener('touchstart',e=>{e.preventDefault();if(joy)return;const t=e.changedTouches[0],q=tp(t);joy={id:t.identifier,ox:q.x,oy:q.y,x:q.x,y:q.y}},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(joy&&t.identifier===joy.id){const q=tp(t);joy.x=q.x;joy.y=q.y}},{passive:false});
const jend=e=>{for(const t of e.changedTouches)if(joy&&t.identifier===joy.id)joy=null};C.addEventListener('touchend',jend);C.addEventListener('touchcancel',jend);
document.addEventListener('touchmove',e=>{if(!e.target.closest||!e.target.closest('.box'))e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()};onkeyup=e=>keys[e.key.toLowerCase()]=0;
function reset(){S={t:0,p:{x:900,y:600,r:13,carry:[]},xp:0,lvl:1,next:5,items:[],spills:[],motor:null,workers:[],
dose:0,rate:0,alarm:false,bub:[],combo:0,comboT:0,bestCombo:0,lean:0,flyOut:[],pend:0,pendT:0,magnet:34,knockCD:0,contam:0,tent:null,tentAt:45,hp:null,hpAt:70+Math.random()*60,tentsOk:0,banner2:0,pcmAlarm:false,stats:{bags:0,spills:0,motors:0,alarms:0},cleans:0,cleanCD:0,banner:0,
up:{spd:1,cap:3,cartCap:8,carrySpd:0.7,mop:1,decon:1,push:0,cart:false},
spawnT:0,spillT:3,motorT:40,paused:true,floats:[],over:false};
for(let i=0;i<5;i++)S.workers.push({x:400+Math.random()*300,y:300+Math.random()*200,vx:0,vy:0,t:0});
for(let i=0;i<4;i++)spawnItem();applyMeta()}
function solid(x,y,r){if(x<r||y<r||x>W-r||y>H-r)return true;for(const w of walls)if(x+r>w[0]&&x-r<w[0]+w[2]&&y+r>w[1]&&y-r<w[1]+w[3])return true;return false}
const CANS=[{x:250,y:210,n:'Aux Bldg'},{x:95,y:440,n:'Pipe Chase'},{x:650,y:320,n:'Containment'},{x:830,y:90,n:'Turbine'},{x:810,y:470,n:'RCA Hall'}],CAN_CAP=8;
function nearCan(x,y,d=55){return CANS.some(c=>Math.hypot(c.x-x,c.y-y)<d)}
function freeSpot(r=14){let x,y;do{x=30+Math.random()*(W-60);y=30+Math.random()*(H-60)}while(solid(x,y,r)||inR({x,y},DAW,30)||inR({x,y},RP,30)||inR({x,y},TENT,20)||nearCan(x,y));return{x,y}}
function inR(p,a,m=0){return p.x>a.x-m&&p.x<a.x+a.w+m&&p.y>a.y-m&&p.y<a.y+a.h+m}
function spawnItem(){const open=CANS.filter(c=>S.items.filter(i=>i.can===c).length<CAN_CAP);if(!open.length)return;const c=open[Math.random()*open.length|0];
const used=new Set(S.items.filter(i=>i.can===c).map(i=>i.slot));let k=0;while(used.has(k))k++;const a=(k%6)/6*6.283+.4,r=k<6?30:24,j=()=>(Math.random()-.5)*4;
S.nSp=(S.nSp||0)+1;S.dirty=true;S.items.push({x:c.x+Math.cos(a)*r+j(),y:c.y+Math.sin(a)*r+j(),z:k<6?0:13,can:c,slot:k,type:Math.random()<.55?'trash':'laundry'})}
function spawnSpill(){S.dirty=true;S.nSl=(S.nSl||0)+1;const s=freeSpot();S.spills.push({...s,r:16+Math.random()*10,prog:0,age:0})}
function float(x,y,txt,col='#fc0'){S.floats.push({x,y,txt,col,t:1.2})}
// ---- XP bubbles, combo, stack ----
// ---- cosmetics, ranks, buddy ----
const COS={hood:[['#f6cf26','Classic Yellow',0],['#ff8a1c','Safety Orange',80],['#ff6fb5','Bubblegum',80],['#38d6e8','Coolant Cyan',80],['#9b59ff','Purple Haze',120],['#2b2b33','Stealth Black',150]],
hat:[['none','No hat',0],['prop','Propeller beanie',100],['cowboy','Cowboy hard hat',120],['party','Party hat',90],['crown','Golden crown',300]],
mop:[['classic','Classic mop',0],['gold','Golden mop',150],['rainbow','Rainbow mop',200],['hockey','Hockey stick',120]]};
function cosOwned(k,i){return i===0||(META.cos&&META.cos.own&&META.cos.own[k+i])}
function cosSel(k){return (META.cos&&META.cos.sel&&META.cos.sel[k])||0}
function applyCos(){const h=COS.hood[cosSel('hood')][0];if(STY.player.hood!==h){STY.player.hood=h;STY.player.cuff=h;STY.player.boot=h;for(const k in sprCache)if(k.startsWith('player'))delete sprCache[k]}}
function cosBuy(k,i,from){META.cos=META.cos||{own:{},sel:{}};const c=COS[k][i][2];if(!cosOwned(k,i)){if(META.pay<c)return;META.pay-=c;META.cos.own[k+i]=1}META.cos.sel[k]=i;saveMeta();applyCos();shop(from,'cos')}
function cosHTML(from){return Object.entries({hood:'🧥 Hood colour',hat:'🎩 Funny hats',mop:'🧹 Mop skins'}).map(([k,n])=>`<h3>${n}</h3>`+COS[k].map((c,i)=>{const own=cosOwned(k,i),sel=cosSel(k)===i;return`<div class="card shop"><h3>${k==='hood'?`<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:${c[0]};vertical-align:middle"></span> `:''}${c[1]}</h3><button ${!own&&META.pay<c[2]?'disabled':''} onclick="cosBuy('${k}',${i},'${from}')">${sel?'✔ Equipped':own?'Equip':'💵 '+c[2]}</button></div>`}).join('')).join('')}
function drawHat(p,q,bob,dir,face){const k=COS.hat[cosSel('hat')][0];if(k==='none')return;const y=q-(52+bob)*1.35-10,x=p+(dir==='s'?face*-2:0);X.save();X.translate(x,y);
if(k==='prop'){X.fillStyle='#e33';X.beginPath();X.arc(0,6,11,Math.PI,0);X.fill();X.fillStyle='#36f';X.fillRect(-11,4,22,3);X.fillStyle='#ffd400';X.fillRect(-1,-6,2,8);const a=S.t*20;X.fillStyle='#3c3';X.save();X.translate(0,-6);X.scale(1,.3);X.rotate(a);X.fillRect(-13,-2,26,4);X.restore()}
else if(k==='cowboy'){X.fillStyle='#b87b3a';X.beginPath();X.ellipse(0,6,22,6,0,0,7);X.fill();X.fillStyle='#9a6228';X.beginPath();X.ellipse(0,0,11,9,0,Math.PI,0);X.fill();X.fillRect(-11,0,22,5)}
else if(k==='party'){X.fillStyle='#f3c';X.beginPath();X.moveTo(-9,8);X.lineTo(9,8);X.lineTo(0,-16);X.closePath();X.fill();X.fillStyle='#ff0';X.beginPath();X.arc(0,-16,3.5,0,7);X.fill();X.fillStyle='#3cf';X.fillRect(-5,0,10,3)}
else if(k==='crown'){X.fillStyle='#ffcc00';X.beginPath();X.moveTo(-12,8);X.lineTo(-12,-4);X.lineTo(-6,2);X.lineTo(0,-8);X.lineTo(6,2);X.lineTo(12,-4);X.lineTo(12,8);X.closePath();X.fill();X.fillStyle='#e22';X.beginPath();X.arc(0,3,2.5,0,7);X.fill()}
X.restore()}
function drawMop(p,q,t){const k=COS.mop[cosSel('mop')][0],sw=Math.sin(t*14)*10;X.save();X.translate(p+18,q-4);X.rotate(sw*.04-.35);X.fillStyle=k==='gold'?'#e0b000':k==='hockey'?'#222':'#8b5a2b';X.fillRect(-1.5,-50,3,50);
if(k==='hockey'){X.fillStyle='#222';X.fillRect(-2,-2,16,5)}else{const cols=k==='rainbow'?['#f33','#f93','#ff3','#3c3','#39f','#93f']:k==='gold'?['#ffe066','#ffd000']:['#eee','#ccc'];for(let i=0;i<8;i++){X.fillStyle=cols[i%cols.length];X.fillRect(-8+i*2,-2,2,9+(i%3))}}X.restore()}
const RANKS=[[0,'🔰 Rookie'],[150,'🧽 Decon Tech'],[600,'⭐ Lead Tech'],[1500,'☢️ RP Trainee']];
function rankInfo(){const L=META.life||{bags:0,spills:0,motors:0,cleans:0,shifts:0};const sc=L.bags+L.spills*2+L.motors*5+L.cleans*10+L.shifts*5;let i=0;while(i+1<RANKS.length&&sc>=RANKS[i+1][0])i++;const nx=RANKS[i+1];return{sc,name:RANKS[i][1],next:nx?nx[1]:null,need:nx?nx[0]-sc:0,pct:nx?(sc-RANKS[i][0])/(nx[0]-RANKS[i][0]):1}}
function updBuddy(dt){const B=S.buddy;if(!B)return;const p=S.p;let tx=p.x-30,ty=p.y-30,sp=150;
if(B.carry){tx=DAW.x+75;ty=DAW.y+55;if(inR(B,DAW)){S.flyOut.push({type:B.carry,sx:iso(B.x,B.y)[0],sy:iso(B.x,B.y)[1]-50,t:0,val:Math.round((B.carry==='laundry'?2:1)*S.bagMul)});B.carry=null;float(B.x,B.y-40,'Got it boss!','#9f9')}}
else{let best=null,bd=220;for(const b of S.bub){const d=Math.hypot(b.x-B.x,b.y-B.y);if(d<bd&&b.t<19.5){bd=d;best=b}}
 if(!best&&ML('buddy')>=2){bd=260;for(const it of S.items){const d=Math.hypot(it.x-B.x,it.y-B.y);if(d<bd&&!it.can){bd=d;best=it}}if(!best)for(const it of S.items){const d=Math.hypot(it.x-B.x,it.y-B.y);if(d<bd){bd=d;best=it}}}
 if(best){tx=best.x;ty=best.y}
 for(const b of S.bub)if(Math.hypot(b.x-B.x,b.y-B.y)<16&&b.t<19.5){b.t=-1;S.pend+=b.v;S.pendT=.35;gainXP(b.v,0,0,true)}
 if(ML('buddy')>=2&&S.buddyCD<=0)for(let i=S.items.length-1;i>=0;i--){const it=S.items[i];if(Math.hypot(it.x-B.x,it.y-B.y)<16){B.carry=it.type;S.items.splice(i,1);break}}}
if(S.buddyCD>0)S.buddyCD-=dt;
const dx=tx-B.x,dy=ty-B.y,d=Math.hypot(dx,dy);if(d>6){const v=Math.min(sp,d*4);B.vx=dx/d*v;B.vy=dy/d*v}else{B.vx=B.vy=0}const nx=B.x+B.vx*dt,ny=B.y+B.vy*dt;if(!solid(nx,B.y,10))B.x=nx;if(!solid(B.x,ny,10))B.y=ny}
// ---- shift modes, daily challenges, PCM, hot particle, tent ----
const MODES={day:{n:'☀️ Day Shift',d:'Normal pace. Normal pay.',spawn:1,pay:1,workers:1,dark:0},night:{n:'🌙 Night Shift',d:'Dark plant, flashlight only. Fewer workers. +20% pay.',spawn:1,pay:1.2,workers:.5,dark:1},peak:{n:'🔥 Outage Peak',d:'Double spawns, crowded. +75% pay.',spawn:2,pay:1.75,workers:1.4,dark:0}};
let MODE='day';
const todayKey=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
const CH_POOL=[{id:'dose2',n:'Finish under 2 mR',ok:s=>s.dose<2},{id:'bags40',n:'Haul 40 bags',ok:s=>s.stats.bags>=40},{id:'noalarm',n:'No ED alarms',ok:s=>s.stats.alarms===0},{id:'spills15',n:'Mop 15 spills',ok:s=>s.stats.spills>=15},{id:'clean2',n:'Clear the plant twice',ok:s=>s.cleans>=2},{id:'combo8',n:'Reach an 8x job combo',ok:s=>s.bestCombo>=8},{id:'motor3',n:"Decon 3 motors",ok:s=>s.stats.motors>=3},{id:'pcm',n:'Clean PCM frisk',ok:s=>!s.pcmAlarm},{id:'tent2',n:'2 tent jobs, perfect doffing',ok:s=>s.tentsOk>=2}];
function dailies(){let x=todayKey();const r=()=>(x=(x*1103515245+12345)%2147483648)/2147483648;const p=[...CH_POOL];const out=[];for(let i=0;i<3;i++)out.push(p.splice(r()*p.length|0,1)[0]);return out}
const CH_PAY=60;
function chList(){const k=todayKey(),done=(META.daily||{})[k]||{};return dailies().map(c=>`<div>${done[c.id]?'✅':'⬜'} ${c.n} <small>(+${CH_PAY} 💵)</small></div>`).join('')}
function shiftSelect(){reset();S.paused=true;OV.innerHTML=`<div class="box wide"><h1>Choose your shift</h1>${Object.entries(MODES).map(([k,m])=>`<div class="card shop" onclick="MODE='${k}';start()"><h3>${m.n}</h3><p>${m.d}</p><button>Clock in</button></div>`).join('')}<h3>📅 Today's challenges</h3><div style="text-align:left;display:inline-block">${chList()}</div><br><button onclick="title()">◀ Back</button></div>`;OV.style.display='flex'}
const TENT={x:900,y:440,w:110,h:80};
function inTent(p){return inR(p,TENT)}
const DOFF=['🧤 Outer gloves','🥼 Anti-C suit','🧤 Inner gloves'];
function doffPrompt(){S.paused=true;let step=0,bad=false;const order=[0,1,2].sort(()=>Math.random()-.5);
OV.innerHTML=`<div class="box"><h2>⛺ Exit the tent: DOFF in order!</h2><p>Tap in the correct order (outer layers first).</p><div id="dseq" style="min-height:28px"></div>${order.map(i=>`<button id="d${i}" style="display:block;width:100%;font-size:20px;margin:8px 0">${DOFF[i]}</button>`).join('')}</div>`;OV.style.display='flex';
order.forEach(i=>document.getElementById('d'+i).onclick=()=>{const b=document.getElementById('d'+i);if(b.disabled)return;b.disabled=true;if(i!==step)bad=true;step++;document.getElementById('dseq').textContent+=DOFF[i]+' → ';if(step===3){const T=TENT;OV.style.display='none';S.paused=false;last=performance.now();
