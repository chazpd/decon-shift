<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Decon Tech: Outage Shift</title>
<style>body{margin:0;background:#111;color:#eee;font-family:sans-serif;overflow:hidden;position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}canvas{position:absolute;touch-action:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75)}
.box{background:#1d2630;border:3px solid #fc0;padding:24px;border-radius:10px;max-width:640px;max-height:92vh;overflow:auto;text-align:center;box-sizing:border-box;margin:8px}
button{min-height:48px;min-width:140px;background:#fc0;border:0;padding:10px 18px;font-size:16px;border-radius:6px;cursor:pointer;margin:6px;font-weight:bold}
.card{display:inline-block;width:170px;min-height:90px;font-size:16px;vertical-align:top;background:#2b3846;border:2px solid #fc0;border-radius:8px;padding:10px;margin:6px;cursor:pointer}
.card:hover{background:#3d5166}ul{text-align:left}</style></head><body>
<canvas id="c"></canvas><div id="ov"></div>
<script>
const C=document.getElementById('c');let X=C.getContext('2d');const OV=document.getElementById('ov');
const W=1100,H=700,SHIFT=300;
const walls=[[0,0,W,12],[0,H-12,W,12],[0,0,12,H],[W-12,0,12,H],
[360,12,16,250],[360,330,16,200],[360,600,16,88],[740,12,16,150],[740,230,16,300],[740,600,16,88],[12,350,160,16],[240,350,120,16],[756,380,120,16],[950,380,138,16]];
const DAW={x:20,y:20,w:150,h:110},RP={x:W-160,y:H-120,w:140,h:100};
const hot=[{x:560,y:110,r:80,rate:300},{x:220,y:540,r:70,rate:150},{x:950,y:200,r:65,rate:500},{x:560,y:520,r:50,rate:120}];
let S,keys={},joy=null;
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
function tp(t){return{x:t.clientX,y:t.clientY}}
C.addEventListener('touchstart',e=>{e.preventDefault();if(joy)return;const t=e.changedTouches[0],q=tp(t);joy={id:t.identifier,ox:q.x,oy:q.y,x:q.x,y:q.y}},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(joy&&t.identifier===joy.id){const q=tp(t);joy.x=q.x;joy.y=q.y}},{passive:false});
const jend=e=>{for(const t of e.changedTouches)if(joy&&t.identifier===joy.id)joy=null};C.addEventListener('touchend',jend);C.addEventListener('touchcancel',jend);
document.addEventListener('touchmove',e=>{if(!e.target.closest||!e.target.closest('.box'))e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()};onkeyup=e=>keys[e.key.toLowerCase()]=0;
function reset(){S={t:0,p:{x:900,y:600,r:13,carry:[]},xp:0,lvl:1,next:5,items:[],spills:[],motor:null,workers:[],
dose:0,rate:0,alarm:false,stats:{bags:0,spills:0,motors:0,alarms:0},
up:{spd:1,cap:2,carrySpd:0.7,mop:1,decon:1,push:0,cart:false},
spawnT:0,spillT:3,motorT:40,paused:true,floats:[],over:false};
for(let i=0;i<5;i++)S.workers.push({x:400+Math.random()*300,y:300+Math.random()*200,vx:0,vy:0,t:0});
for(let i=0;i<4;i++)spawnItem();}
function solid(x,y,r){if(x<r||y<r||x>W-r||y>H-r)return true;for(const w of walls)if(x+r>w[0]&&x-r<w[0]+w[2]&&y+r>w[1]&&y-r<w[1]+w[3])return true;return false}
function freeSpot(r=14){let x,y;do{x=30+Math.random()*(W-60);y=30+Math.random()*(H-60)}while(solid(x,y,r)||inR({x,y},DAW,30)||inR({x,y},RP,30));return{x,y}}
function inR(p,a,m=0){return p.x>a.x-m&&p.x<a.x+a.w+m&&p.y>a.y-m&&p.y<a.y+a.h+m}
function spawnItem(){const s=freeSpot();S.items.push({...s,type:Math.random()<.55?'trash':'laundry'})}
function spawnSpill(){const s=freeSpot();S.spills.push({...s,r:16+Math.random()*10,prog:0,age:0})}
function float(x,y,txt,col='#fc0'){S.floats.push({x,y,txt,col,t:1.2})}
function gainXP(n,x,y){S.xp+=n;float(x,y,'+'+n+' XP');while(S.xp>=S.next){S.xp-=S.next;S.lvl++;S.next=Math.round(S.next*1.35+3);levelUp()}}
const UPS=[
{id:'spd',n:'👟 Fast Feet',d:'+15% move speed',ok:()=>1,f:()=>S.up.spd*=1.15},
{id:'cap',n:'🎒 Bigger Arms',d:'+1 bag carry capacity',ok:()=>!S.up.cart,f:()=>S.up.cap++},
{id:'cs',n:'💪 Strong Back',d:'Less slowdown while carrying',ok:()=>S.up.carrySpd<.98,f:()=>S.up.carrySpd=Math.min(1,S.up.carrySpd+.1)},
{id:'mop',n:'🧽 Pro Mop',d:'+40% mop speed',ok:()=>1,f:()=>S.up.mop*=1.4},
{id:'dec',n:'🧴 Decon Wizard',d:'+50% decon speed on motors',ok:()=>1,f:()=>S.up.decon*=1.5},
{id:'push',n:'🫸 "Coming Through!"',d:'Shove workers out of your way (stacks)',ok:()=>S.up.push<3,f:()=>S.up.push++},
{id:'cart',n:'🛒 Laundry Cart',d:'Carry 8 bags! But you turn slow & workers block more',ok:()=>!S.up.cart&&S.lvl>=3,f:()=>{S.up.cart=true;S.up.cap=Math.max(8,S.up.cap+4)}},
{id:'cartp',n:'🛒 Cart Wheels',d:'+3 cart capacity',ok:()=>S.up.cart,f:()=>S.up.cap+=3},
{id:'alara',n:'🧱 Lead Blanket',d:'Shrink a random hot zone by 40%',ok:()=>1,f:()=>{const h=hot[Math.random()*hot.length|0];h.r*=.6;h.rate*=.6}}];
function levelUp(){S.paused=true;const pool=UPS.filter(u=>u.ok()).sort(()=>Math.random()-.5).slice(0,3);
OV.innerHTML=`<div class="box"><h2>⬆ LEVEL ${S.lvl}!</h2><p>Pick an upgrade:</p>${pool.map((u,i)=>`<div class="card" id="u${i}"><h3>${u.n}</h3><p>${u.d}</p></div>`).join('')}</div>`;OV.style.display='flex';
pool.forEach((u,i)=>document.getElementById('u'+i).onclick=()=>{u.f();OV.style.display='none';S.paused=false;last=performance.now()})}
function update(dt){const p=S.p,u=S.up;S.t+=dt;if(S.t>=SHIFT)return endShift();
const ramp=1+S.t/120;
S.spawnT-=dt;if(S.spawnT<=0){S.spawnT=Math.max(1.2,4/ramp);if(S.items.length<25)spawnItem()}
S.spillT-=dt;if(S.spillT<=0){S.spillT=Math.max(2.5,8/ramp);if(S.spills.length<15)spawnSpill()}
S.motorT-=dt;if(S.motorT<=0&&!S.motor){const s=freeSpot(24);S.motor={...s,prog:0,need:8};S.motorT=60}
// movement
let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
if(joy){const jx=joy.x-joy.ox,jy=joy.y-joy.oy,jl=Math.hypot(jx,jy);if(jl>8){const m=Math.min(1,jl/60);dx=jx/jl*m;dy=jy/jl*m}}
{const m=Math.min(1,Math.hypot(dx,dy));const r=screenToWorld(dx,dy);dx=r[0]*m;dy=r[1]*m}
let sp=170*u.spd*(p.carry.length?u.carrySpd:1)*(u.cart?0.85:1);
p.vx=p.vx||0;p.vy=p.vy||0;const acc=u.cart?3:14;p.vx+=(dx*sp-p.vx)*Math.min(1,acc*dt);p.vy+=(dy*sp-p.vy)*Math.min(1,acc*dt);
const pr=u.cart?18:p.r;
if(!solid(p.x+p.vx*dt,p.y,pr))p.x+=p.vx*dt;if(!solid(p.x,p.y+p.vy*dt,pr))p.y+=p.vy*dt;
// workers
for(const w of S.workers){w.t-=dt;if(w.t<=0){const a=Math.random()*6.28;w.vx=Math.cos(a)*60;w.vy=Math.sin(a)*60;w.t=1+Math.random()*3}
if(!solid(w.x+w.vx*dt,w.y,12))w.x+=w.vx*dt;else w.vx*=-1;if(!solid(w.x,w.y+w.vy*dt,12))w.y+=w.vy*dt;else w.vy*=-1;
const ddx=p.x-w.x,ddy=p.y-w.y,d=Math.hypot(ddx,ddy),md=pr+12;
if(d<md&&d>0){const nx=ddx/d,ny=ddy/d,o=md-d;
if(u.push){const k=u.push*.35;const wx=w.x-nx*o*(1+k),wy=w.y-ny*o*(1+k);if(!solid(wx,wy,12)){w.x=wx;w.y=wy;if(Math.random()<.02)float(w.x,w.y-20,'Hey!','#aaf')}else{p.x+=nx*o;p.y+=ny*o}}
else{p.x+=nx*o;p.y+=ny*o;p.vx*=u.cart?.2:.5;p.vy*=u.cart?.2:.5}}}
if(S.workers.length<5+S.t/50)S.workers.push({...freeSpot(),vx:0,vy:0,t:0});
// pickup
for(let i=S.items.length-1;i>=0;i--){const it=S.items[i];if(Math.hypot(it.x-p.x,it.y-p.y)<pr+12&&p.carry.length<u.cap){p.carry.push(it.type);S.items.splice(i,1)}}
if(inR(p,DAW)&&p.carry.length){const n=p.carry.length;const xp=p.carry.reduce((a,t)=>a+(t==='laundry'?2:1),0)+(n>=4?Math.floor(n/2):0);S.stats.bags+=n;p.carry=[];gainXP(xp,p.x,p.y-20);spark(p.x,p.y,'#ffd400',14)}
// spills: mop
for(let i=S.spills.length-1;i>=0;i--){const s=S.spills[i];s.age+=dt;if(s.age>40&&s.r<40){s.r+=dt*0.3}
if(Math.hypot(s.x-p.x,s.y-p.y)<s.r+4&&!u.cart){if(Math.random()<dt*12)spark(s.x,s.y,'#bfe8ff',3);s.prog+=dt*u.mop*(30/s.r)*0.55;if(s.prog>=1){S.spills.splice(i,1);S.stats.spills++;gainXP(3,s.x,s.y)}}}
if(S.motor){const m=S.motor;if(Math.hypot(m.x-p.x,m.y-p.y)<pr+28){m.prog+=dt*u.decon;if(m.prog>=m.need){S.motor=null;S.stats.motors++;gainXP(15,m.x,m.y);spark(m.x,m.y,'#f80',20)}}}
// dose
let rate=0.5;for(const h of hot){const d=Math.hypot(h.x-p.x,h.y-p.y);if(d<h.r)rate+=h.rate*(1-d/h.r*.6);else if(d<h.r*1.6)rate+=h.rate*.08}
S.rate=rate;S.dose+=rate*dt/3600*12; // 12x time compression
if(!S.alarm&&(S.dose>=10||rate>=100)){S.alarm=true;S.stats.alarms++;float(p.x,p.y-30,'ED ALARM! 🚨 Go see RP','#f44');S.alarmDoseBase=S.dose}
if(S.alarm&&inR(p,RP)){S.alarm=false;const lost=Math.min(S.xp,Math.ceil(S.next*.4));S.xp-=lost;float(p.x,p.y-30,'ED reset. -'+lost+' XP. Stay ALARA!','#f88');if(S.dose>=10)S.dose10=(S.dose10||0)+1}
for(const f of S.floats){f.t-=dt;f.y-=30*dt}S.floats=S.floats.filter(f=>f.t>0)}
function endShift(){S.paused=true;S.over=true;const dose=S.dose,alara=dose<3?500:dose<6?250:dose<10?100:0;
const score=S.stats.bags*10+S.stats.spills*25+S.stats.motors*100+S.lvl*50+alara-S.stats.alarms*100;
OV.innerHTML=`<div class="box"><h1>🔔 END OF SHIFT</h1><table style="margin:auto;font-size:18px;text-align:left">
<tr><td>🗑️ Bags hauled to DAW</td><td>${S.stats.bags}</td></tr><tr><td>🧽 Spills mopped</td><td>${S.stats.spills}</td></tr>
<tr><td>⚙️ Motors decon'd</td><td>${S.stats.motors}</td></tr><tr><td>⭐ Level reached</td><td>${S.lvl}</td></tr>
<tr><td>☢️ Total dose</td><td>${dose.toFixed(2)} mR</td></tr><tr><td>🚨 ED alarms</td><td>${S.stats.alarms}</td></tr>
<tr><td>🏅 ALARA bonus</td><td>${alara}</td></tr><tr><td><b>SCORE</b></td><td><b>${score}</b></td></tr></table>
<p>${alara>=500?'RP is proud of you. Textbook ALARA.':alara?'Decent dose management.':'RP wants a word with you...'}</p><button onclick="start()">Work another shift</button></div>`;OV.style.display='flex'}
const IX=0.72,IY=0.36,WH=30;let DPR=1,VW=0,VH=0,ZM=1,camX=0,camY=0,floorC=null;
function iso(x,y,z=0){return[(x-y)*IX,(x+y)*IY-z]}
function poly(pts,fill,stroke){X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)X.lineTo(pts[i][0],pts[i][1]);X.closePath();X.fillStyle=fill;X.fill();if(stroke){X.strokeStyle=stroke;X.stroke()}}
function quad(x,y,w,h,z,fill,stroke){poly([iso(x,y,z),iso(x+w,y,z),iso(x+w,y+h,z),iso(x,y+h,z)],fill,stroke)}
function box(x,y,w,h,z,top,side1,side2){poly([iso(x,y+h,0),iso(x+w,y+h,0),iso(x+w,y+h,z),iso(x,y+h,z)],side1);poly([iso(x+w,y,0),iso(x+w,y+h,0),iso(x+w,y+h,z),iso(x+w,y,z)],side2);quad(x,y,w,h,z,top)}
function shadow(x,y,r){const[a,b]=iso(x,y);X.fillStyle='rgba(0,0,0,.3)';X.beginPath();X.ellipse(a,b,r*IX*1.4,r*IY*1.4,0,0,7);X.fill()}
function buildFloor(){floorC=document.createElement('canvas');floorC.width=1600;floorC.height=760;const g=floorC.getContext('2d'),o=X;X=g;g.translate(H*IX+20,20);
const T=50;for(let x=0;x<W;x+=T)for(let y=0;y<H;y+=T){const v=((x/T+y/T)%2)?'#7f8a86':'#76817d';quad(x,y,T,T,0,v,'rgba(0,0,0,.12)')}
// painted walkway stripes
g.lineWidth=3;g.strokeStyle='rgba(255,210,0,.6)';g.setLineDash([]);
for(const r of [[30,270,330,30],[390,560,330,30],[780,300,300,30]]){const[a,b]=iso(r[0],r[1]),[c,d]=iso(r[0]+r[2],r[1]);g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke();const[e,f]=iso(r[0],r[1]+r[3]),[h,k]=iso(r[0]+r[2],r[1]+r[3]);g.beginPath();g.moveTo(e,f);g.lineTo(h,k);g.stroke()}
quad(DAW.x,DAW.y,DAW.w,DAW.h,0,'#8a7440');quad(RP.x,RP.y,RP.w,RP.h,0,'#4e6c80');
g.lineWidth=1;X=o}
function fit(){DPR=Math.min(2,devicePixelRatio||1);VW=innerWidth;VH=innerHeight;C.width=VW*DPR;C.height=VH*DPR;C.style.width=VW+'px';C.style.height=VH+'px';C.style.left='0';C.style.top='0';ZM=Math.max(.55,Math.min(1.4,Math.min(VW,VH)/560))}
function screenToWorld(a,b){const u=a/IX,v=b/IY;let x=(u+v)/2,y=(v-u)/2;const l=Math.hypot(x,y);return l?[x/l,y/l]:[0,0]}
function hotZoneDraw(h,t){const pul=.5+.5*Math.sin(t*3+h.x);const[cx,cy]=iso(h.x,h.y);
X.save();X.translate(cx,cy);X.scale(1,IY/IX);const g=X.createRadialGradient(0,0,0,0,0,h.r*IX*1.45);g.addColorStop(0,`rgba(255,0,200,${.35+.2*pul})`);g.addColorStop(.7,'rgba(255,0,200,.12)');g.addColorStop(1,'rgba(255,0,200,0)');X.fillStyle=g;X.beginPath();X.arc(0,0,h.r*IX*1.45,0,7);X.fill();
X.lineWidth=7;X.setLineDash([14,14]);X.strokeStyle='#ffd400';X.beginPath();X.arc(0,0,h.r*IX*1.414,0,7);X.stroke();X.lineDashOffset=14;X.strokeStyle='#d0109a';X.stroke();X.setLineDash([]);X.lineDashOffset=0;X.restore()}
function postsDraw(h,list){for(let i=0;i<8;i++){const a=i/8*6.283,x=h.x+Math.cos(a)*h.r,y=h.y+Math.sin(a)*h.r;list.push({d:x+y,f:()=>{const[p,q]=iso(x,y);X.fillStyle='#ffd400';X.fillRect(p-2,q-22,4,22);X.fillStyle='#d0109a';X.fillRect(p-2,q-16,4,4);X.fillRect(p-2,q-8,4,4)}})}
const sx=h.x+h.r*.7,sy=h.y+h.r*.7;list.push({d:sx+sy+1,f:()=>{const[p,q]=iso(sx,sy);X.fillStyle='#333';X.fillRect(p-1,q-40,2,40);X.fillStyle='#ffd400';X.fillRect(p-26,q-62,52,26);X.strokeStyle='#d0109a';X.lineWidth=2;X.strokeRect(p-26,q-62,52,26);X.lineWidth=1;X.fillStyle='#d0109a';X.font='bold 14px sans-serif';X.fillText('☢',p,q-44);X.font='bold 8px sans-serif';X.fillText(Math.round(h.rate)+' mR/hr',p,q-38)}})}
function person(x,y,body,hood,t,moving,carry){const bob=moving?Math.abs(Math.sin(t*12))*3:0,[p,q]=iso(x,y);shadow(x,y,11);
const leg=moving?Math.sin(t*12)*3:0;X.fillStyle='#222';X.fillRect(p-5,q-10+leg*.3,4,10);X.fillRect(p+1,q-10-leg*.3,4,10);
X.fillStyle=body;X.beginPath();X.ellipse(p,q-20-bob,9,12,0,0,7);X.fill();X.fillStyle='rgba(0,0,0,.15)';X.beginPath();X.ellipse(p+3,q-19-bob,5,10,0,0,7);X.fill();
X.fillStyle=hood;X.beginPath();X.arc(p,q-36-bob,7.5,0,7);X.fill();X.fillStyle='#f1c9a0';X.beginPath();X.arc(p,q-35-bob,4.5,0,7);X.fill();
if(carry)for(let i=0;i<Math.min(carry,6);i++){X.fillStyle=i%2?'#e8e8e8':'#2c2c2c';X.beginPath();X.arc(p-6+(i%2)*12,q-46-bob-(i>>1)*8,6,0,7);X.fill()}}
let parts=[];function spark(x,y,c,n=6){for(let i=0;i<n;i++)parts.push({x,y,z:4,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,vz:60+Math.random()*60,c,t:.6})}
function draw(){const t=S.t||performance.now()/1000;X.setTransform(1,0,0,1,0,0);X.fillStyle='#1a1e22';X.fillRect(0,0,C.width,C.height);if(!floorC)buildFloor();
const dt=1/60;for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vz-=300*dt;q.z=Math.max(0,q.z+q.vz*dt);q.t-=dt}parts=parts.filter(q=>q.t>0);
const p=S.p,[px,py]=iso(p.x,p.y);camX+=(px-camX)*.12;camY+=(py-camY)*.12;
X.setTransform(DPR*ZM,0,0,DPR*ZM,DPR*(VW/2-camX*ZM),DPR*(VH/2-camY*ZM));X.textAlign='center';
X.drawImage(floorC,-(H*IX+20),-20);
for(const h of hot)hotZoneDraw(h,t);
for(const s of S.spills){const[a,b]=iso(s.x,s.y);X.save();X.translate(a,b);X.scale(1,.5);X.fillStyle='rgba(70,150,60,.75)';X.beginPath();X.arc(0,0,s.r*1.05,0,7);X.fill();X.fillStyle='rgba(255,255,255,.35)';X.beginPath();X.ellipse(-s.r*.3,-s.r*.3,s.r*.35,s.r*.18,-.5,0,7);X.fill();X.restore();if(s.prog>0)bar(a,b-s.r*.6-8,s.prog,'#6cf')}
const L=[];
for(const w of walls){const n=Math.max(1,Math.ceil(Math.max(w[2],w[3])/40));for(let i=0;i<n;i++){const hz=w[2]>=w[3];const x=hz?w[0]+i*w[2]/n:w[0],y=hz?w[1]:w[1]+i*w[3]/n,ww=hz?w[2]/n:w[2],hh=hz?w[3]:w[3]/n;L.push({d:x+ww+y+hh-10,f:()=>box(x,y,ww,hh,WH,'#9aa3aa','#5c656c','#747d84')})}}
for(const h of hot)postsDraw(h,L);
for(let i=0;i<3;i++){const x=DAW.x+20+i*42,y=DAW.y+15;L.push({d:x+y+30,f:()=>{box(x,y,32,26,30,['#c33','#36c','#ca3'][i],'#722','#933');const[a,b]=iso(x+16,y+13,31);X.fillStyle='#fff';X.font='bold 9px sans-serif';X.fillText(['DAW','LNDRY','DAW'][i],a,b+3)}})}
{const x=DAW.x+20,y=DAW.y+60;L.push({d:x+y+40,f:()=>{box(x,y,110,40,34,'#2c6e9e','#1c4a6b','#245a80');const[a,b]=iso(x+55,y+20,35);X.fillStyle='#fff';X.font='bold 10px sans-serif';X.fillText('SEA-LAND',a,b+3)}})}
